# Config do Supabase CLI — fonte da verdade do deploy das Edge Functions.
# Nas versões atuais do CLI, o verify_jwt vem DAQUI (a flag --no-verify-jwt
# está deprecada). As funções-proxy do Bling fazem a própria auth (via a tabela
# bling_tokens), então NÃO devem exigir JWT do Supabase no portão — senão a
# chamada é barrada com {"code":"INVALID_CREDENTIALS"}.
project_id = "qoouzjntyfzcxnwjksiu"

[functions.bling-pedidos]
verify_jwt = false

[functions.bling-pedido-itens]
verify_jwt = false

[functions.bling-produtos]
verify_jwt = false

[functions.bling-produto-foto]
verify_jwt = false

# Envio de WhatsApp (fidelidade/garantia). No modo 'none' só monta o link wa.me;
# nos modos pagos faz a própria checagem. Portão sem JWT como as demais.
[functions.whatsapp-enviar]
verify_jwt = false

# Callback OAuth (o Bling redireciona o navegador pra cá — não tem como mandar JWT)
[functions.bling-auth]
verify_jwt = false

# Cria/redefine o acesso da revendedora (usa service role internamente).
# EXIGE JWT: a função ainda confere no banco se quem chamou é admin/gestor.
[functions.criar-acesso-revendedora]
verify_jwt = true

# ── Nuvemshop (sincronização de estoque do site) ──────────────────────
# Guarda store_id/access_token. EXIGE JWT e ainda confere no banco se é admin.
[functions.nuvemshop-set-token]
verify_jwt = true

# Sincroniza o estoque. Tem modo cron (autentica com a service role key) e
# modo manual (JWT de gestor) — por isso o portão fica aberto e a checagem
# é feita dentro da função, senão o cron seria barrado.
[functions.nuvemshop-sync-estoque]
verify_jwt = false

# Busca produtos na loja para a tela de vínculo. Confere o JWT de gestor
# internamente (portão aberto só para o erro sair legível em JSON).
[functions.nuvemshop-buscar-produtos]
verify_jwt = false

# Webhook order/paid — a Nuvemshop não manda JWT do Supabase. A autenticidade
# vem do HMAC-SHA256 (secret NUVEMSHOP_CLIENT_SECRET).
[functions.nuvemshop-webhook-pedido]
verify_jwt = false

# Cria produtos novos na loja a partir do catálogo do app. Só modo manual
# (sem cron) — confere o JWT de admin/func_completo internamente, portão
# aberto só para o erro sair legível em JSON (mesmo padrão das irmãs acima).
[functions.nuvemshop-criar-produtos]
verify_jwt = false
